[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blobwatch"
version = "0.1.0"
description = "who bought ethereum's blob space, and what they paid: blob transactions of the last blocks grouped by rollup, from a public rpc. no keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alina Schanz" }]
keywords = ["ethereum", "eip-4844", "blobs", "rollups", "l2", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/alinaschanz/blobwatch"
Author = "https://alinaschanz.life"
Issues = "https://github.com/alinaschanz/blobwatch/issues"
Changelog = "https://github.com/alinaschanz/blobwatch/blob/main/CHANGELOG.md"

[project.scripts]
blobwatch = "blobwatch.cli:main"

[tool.setuptools]
packages = ["blobwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
